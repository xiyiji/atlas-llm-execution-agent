name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt pip-audit
      - run: ruff check app tests scripts
      - run: pytest
        env:
          FORCE_DEMO: "1"
          ATLAS_DATA_DIR: /tmp/atlas-test-data
      - run: pip-audit -r requirements.txt

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: atlas:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  distributed-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start production topology
        run: docker compose up --detach --build
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          REDIS_PASSWORD: ci-redis-password
          ATLAS_API_KEYS: ci:ci-atlas-key
          SESSION_SECRET: ci-session-secret-that-is-longer-than-32-characters
      - name: Run authenticated end-to-end task
        run: python scripts/compose_smoke.py
      - name: Capture service logs
        if: failure()
        run: docker compose logs --no-color
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          REDIS_PASSWORD: ci-redis-password
          ATLAS_API_KEYS: ci:ci-atlas-key
          SESSION_SECRET: ci-session-secret-that-is-longer-than-32-characters
      - name: Stop production topology
        if: always()
        run: docker compose down --volumes
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          REDIS_PASSWORD: ci-redis-password
          ATLAS_API_KEYS: ci:ci-atlas-key
          SESSION_SECRET: ci-session-secret-that-is-longer-than-32-characters
